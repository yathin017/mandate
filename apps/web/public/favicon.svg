<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Mandate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9be0"/>
      <stop offset="1" stop-color="#2d4f8f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The issuer's rails: upper and lower bound, each locked at both ends. -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.55">
    <line x1="104" y1="140" x2="408" y2="140"/>
    <line x1="104" y1="372" x2="408" y2="372"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="104" cy="140" r="14"/><circle cx="408" cy="140" r="14"/>
    <circle cx="104" cy="372" r="14"/><circle cx="408" cy="372" r="14"/>
  </g>
  <!-- The price path: an M that touches both rails and never crosses them. -->
  <path d="M136 372 L196 140 L256 290 L316 140 L376 372" fill="none" stroke="#ffffff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
