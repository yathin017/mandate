# Foundry config for Mandate contracts.
# Compiler settings mirror 1inch swap-vm v1.0.2 (the version deployed as the canonical
# AquaSwapVMRouter) so imported SwapVM/Aqua sources compile exactly as audited.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 700
via_ir = true
# Scripts read per-chain config and write per-chain deployments (see repo README).
fs_permissions = [
    { access = "read", path = "../config" },
    { access = "read-write", path = "../deployments" },
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
bracket_spacing = true
